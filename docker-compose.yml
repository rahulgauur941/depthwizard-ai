version: '3.8'

services:
  depthwizard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - uploads_data:/app/backend/uploads
      - outputs_data:/app/backend/outputs
    restart: unless-stopped

volumes:
  uploads_data:
  outputs_data:
